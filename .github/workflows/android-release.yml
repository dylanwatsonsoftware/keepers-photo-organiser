name: Android Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark this as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release details
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
          else
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must resemble v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/keepers-$RELEASE_TAG-debug.apk"
          cd dist
          sha256sum "keepers-$RELEASE_TAG-debug.apk" > "keepers-$RELEASE_TAG-debug.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          release_args=(
            release create "$RELEASE_TAG"
            "dist/keepers-$RELEASE_TAG-debug.apk"
            "dist/keepers-$RELEASE_TAG-debug.apk.sha256"
            --target "$GITHUB_SHA"
            --title "Keepers $RELEASE_TAG"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh "${release_args[@]}"
